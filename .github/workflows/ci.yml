name: Diagnosis checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 1'
permissions:
  contents: read
concurrency:
  group: diagnosis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Verify actual static-asset response headers
        run: |
          npm run preview:worker > /tmp/diagnosis-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:headers
      - name: Worker diagnostics on failure
        if: failure()
        run: cat /tmp/diagnosis-worker.log 2>/dev/null || true
